name: Local database verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify pinned Supabase CLI
        run: test "$(npx --no-install supabase --version)" = "2.121.0"

      # A fresh, job-local database is created from migrations. No remote project is linked.
      - name: Start local Supabase stack
        shell: bash
        run: |
          if ! npx --no-install supabase start --exclude vector,logflare > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Supabase startup failed. CLI output was suppressed to avoid logging generated local credentials."
            exit 1
          fi

      - name: Expose local Realtime test connection
        id: local-supabase
        shell: bash
        run: |
          if ! status_env="$(npx --no-install supabase status --output env 2>"$RUNNER_TEMP/supabase-status.log")"; then
            echo "Could not read the local Supabase environment. CLI output was suppressed to avoid logging generated credentials."
            exit 1
          fi

          read_env_value() {
            local name="$1" line value
            line="$(printf '%s\n' "$status_env" | grep -m1 "^${name}=")" || return 1
            value="${line#*=}"
            value="${value%$'\r'}"
            if [[ ${#value} -ge 2 && ${value:0:1} == '"' && ${value: -1} == '"' ]]; then
              value="${value:1:${#value}-2}"
            elif [[ ${#value} -ge 2 && ${value:0:1} == "'" && ${value: -1} == "'" ]]; then
              value="${value:1:${#value}-2}"
            fi
            printf '%s' "$value"
          }

          api_url="$(read_env_value API_URL)" || {
            echo "Supabase status did not contain API_URL."
            exit 1
          }
          publishable_key="$(read_env_value PUBLISHABLE_KEY)" || {
            echo "Supabase status did not contain PUBLISHABLE_KEY."
            exit 1
          }

          if ! API_URL_TO_VALIDATE="$api_url" node --input-type=module -e '
            try {
              const url = new URL(process.env.API_URL_TO_VALIDATE);
              if (!["http:", "https:"].includes(url.protocol) || !url.hostname) process.exit(1);
            } catch {
              process.exit(1);
            }
          '; then
            echo "Supabase API_URL is not a valid HTTP or HTTPS URL."
            exit 1
          fi

          if [[ -z "$publishable_key" || "$publishable_key" == *$'\n'* || "$publishable_key" == *$'\r'* ]]; then
            echo "Supabase PUBLISHABLE_KEY is missing or malformed."
            exit 1
          fi

          printf '::add-mask::%s\n' "$publishable_key"
          printf 'api_url=%s\n' "$api_url" >> "$GITHUB_OUTPUT"
          printf 'publishable_key=%s\n' "$publishable_key" >> "$GITHUB_OUTPUT"

      - name: Run pgTAP and RLS tests
        run: npx --no-install supabase test db

      - name: Run two-session concurrency regression
        run: npm run test:db:concurrency

      - name: Run two-user Realtime permission regression
        env:
          HANILOG_LOCAL_SUPABASE_URL: ${{ steps.local-supabase.outputs.api_url }}
          HANILOG_LOCAL_SUPABASE_PUBLISHABLE_KEY: ${{ steps.local-supabase.outputs.publishable_key }}
        run: npm run test:db:realtime

      - name: Run notification Worker with local mock provider
        env:
          HANILOG_LOCAL_SUPABASE_URL: ${{ steps.local-supabase.outputs.api_url }}
          HANILOG_LOCAL_SUPABASE_PUBLISHABLE_KEY: ${{ steps.local-supabase.outputs.publishable_key }}
        shell: bash
        run: |
          worker_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$worker_secret"
          env_file="$RUNNER_TEMP/hanilog-notification.env"
          function_log="$RUNNER_TEMP/hanilog-functions.log"
          printf 'NOTIFICATION_WORKER_SECRET=%s\nNOTIFICATION_DELIVERY_MODE=mock\n' "$worker_secret" > "$env_file"
          cleanup() {
            if [[ -n "${functions_pid:-}" ]]; then kill "$functions_pid" 2>/dev/null || true; fi
            rm -f "$env_file"
          }
          trap cleanup EXIT
          npx --no-install supabase functions serve --no-verify-jwt --env-file "$env_file" notification-worker manage-push-subscription > "$function_log" 2>&1 &
          functions_pid=$!
          ready=false
          for attempt in $(seq 1 45); do
            if ! kill -0 "$functions_pid" 2>/dev/null; then
              echo "Local Edge Functions runtime failed to start; output withheld to avoid accidental credential disclosure."
              exit 1
            fi
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
              -H "apikey: $HANILOG_LOCAL_SUPABASE_PUBLISHABLE_KEY" \
              http://127.0.0.1:54321/functions/v1/notification-worker || true)"
            if [[ "$status" == "401" ]]; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Local Edge Functions runtime did not become ready."
            exit 1
          fi
          NOTIFICATION_WORKER_SECRET="$worker_secret" npm run test:db:notifications
