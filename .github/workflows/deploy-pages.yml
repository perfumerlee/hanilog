name: Publish HaniLog Staging to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_public_deployment:
        description: 'I understand that GitHub Pages is public and will serve the Staging app.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_public_deployment == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Validate public Staging build inputs
        run: node scripts/verify-pages-env.mjs
        env:
          PAGES_BASE_PATH: hanilog
          VITE_DEMO_MODE: 'false'
          VITE_PET_PROFILE_PHOTO_UPLOAD_ENABLED: 'false'
          VITE_SUPABASE_URL: https://vxgdewxqtbuychrvunjr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HANILOG_STAGING_PUBLISHABLE_KEY }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          VITE_DEMO_MODE: 'true'
      - run: npm run build:staging
        env:
          PAGES_BASE_PATH: hanilog
          VITE_DEMO_MODE: 'false'
          VITE_PET_PROFILE_PHOTO_UPLOAD_ENABLED: 'false'
          VITE_SUPABASE_URL: https://vxgdewxqtbuychrvunjr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HANILOG_STAGING_PUBLISHABLE_KEY }}

      - name: Inspect deployable artifact
        run: node scripts/verify-pages-build.mjs
        env:
          PAGES_BASE_PATH: hanilog

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_public_deployment == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
